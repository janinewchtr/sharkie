<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sharkie</title>
    <link rel="shortcut icon" href="img/1.Sharkie/1.IDLE/1.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <script src="models/drawable-object.class.js"></script>
    <script src="models/movable-object.class.js"></script>
    <script src="models/status-bar.class.js"></script>
    <script src="models/background-objects.class.js"></script>
    <script src="models/character.class.js"></script>
    <script src="models/puffer-fish.class.js"></script>
    <script src="models/jelly-fish.class.js"></script>
    <script src="models/poison.class.js"></script>
    <script src="models/coins.class.js"></script>
    <script src="models/level.class.js"></script>
    <script src="models/throwable-object.class.js"></script>
    <script src="models/world.class.js"></script>
    <script src="models/keyboard.class.js"></script>
    <script src="models/endboss.class.js"></script>
    <script src="levels/level1.js"></script>
    <script src="js/game.js"></script>
</head>
<body>
    <h1>Sharkie Attack</h1>

    <div class="game-wrapper" id="game-wrapper">
        <div id="start-screen" class="overlay">
          <div class="start-panel">
            <h2 class="start-title">How to Play</h2>
      
            <div class="controls-list">
              <div class="control-row">
                <img class="key-img" src="img/6.Botones/Key/arrow keys.png" alt="Arrow Keys">
                <img class="desc-img" src="img/6.Botones/Tittles/Move title.png" alt="Move Sharkie">
              </div>
      
              <div class="control-row">
                <img class="key-img d-key" src="img/6.Botones/Key/D key.png" alt="D Key">
                <img class="desc-img" src="img/6.Botones/Tittles/Attack tittle.png" alt="Attack">
              </div>
      
              <div class="control-row">
                <img class="key-img space-key" src="img/6.Botones/Key/Space Bar key.png" alt="Space Bar">
                <h2 class="finslap-title">Fin Slap</h2>
              </div>

              
            </div>
      
            <button class="start-button" onclick="startGame()">
              <img src="img/6.Botones/Start/2.png" alt="Start">
            </button>
          </div>
        </div>

        <button class="fullscreen-button" onclick="toggleFullscreen()">
            <img src="img/6.Botones/Full Screen/Mesa de trabajo 7.png" alt="Fullscreen">
          </button>

        <div id="game-over-screen" class="overlay game-over-overlay">
            <div class="start-panel">
              <h2 class="start-title">Game Over</h2>
          
              <button class="start-button" onclick="location.reload()">
                <img src="img/6.Botones/Try again/Recurso 17.png" alt="Restart">
              </button>
            </div>
          </div>

          <div id="you-win-screen" class="overlay you-win-overlay">
            <img class="you-win-img" src="img/6.Botones/Tittles/You win/Mesa de trabajo 1.png" alt="You Win">
          </div>
      
        <canvas id="canvas" width="820" height="400"></canvas>
      </div>
</body>
</html>
